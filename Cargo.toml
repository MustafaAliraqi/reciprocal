[package]
name = "reciprocal"
version = "0.2.0"
edition = "2021"
description = "A local-first agent orchestration workspace for autoregressive and language-diffusion models"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json"] }
dirs = "5"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"
